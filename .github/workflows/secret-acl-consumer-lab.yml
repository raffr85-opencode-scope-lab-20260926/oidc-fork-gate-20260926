name: Disposable organization-secret ACL hash consumer
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence and hash only
        env:
          CANARY: ${{ secrets.OPENCODE_ACL_20260926_1720 }}
        run: |
          node <<'NODE'
          const crypto = require("node:crypto")
          const value = process.env.CANARY || ""
          console.log("ACL_CONSUMER_LAB present=" + Boolean(value))
          if (value) console.log("ACL_CONSUMER_LAB sha256=" + crypto.createHash("sha256").update(value).digest("hex"))
          NODE
